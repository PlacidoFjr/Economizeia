<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#123b3a">
<title>Sem conexão · EconomizeIA</title>
<style>
:root{font-family:system-ui,sans-serif;color:#123b3a;background:#f1f5f9;color-scheme:light}
body{margin:0;min-height:100dvh;display:grid;place-items:center}
main{max-width:24rem;padding:2rem;text-align:center}
img{width:80px;height:80px;border-radius:18px}
h1{font-size:1.6rem;line-height:1.2}
p{color:#475569;line-height:1.6}
button{font:inherit;font-weight:600;background:#123b3a;color:white;border:0;border-radius:8px;min-height:44px;padding:.75rem 1.25rem;cursor:pointer}
button:focus-visible{outline:3px solid #0891b2;outline-offset:4px}
@media(prefers-color-scheme:dark){:root{background:#020617;color:#f1f5f9}p{color:#cbd5e1}}
</style>
</head>
<body>
<main>
<img src="/icons/app-192.png" alt="EconomizeIA">
<h1>Você está sem conexão</h1>
<p>Conecte-se à internet para acessar suas finanças e registrar lançamentos.</p>
<button type="button" id="retry">Tentar novamente</button>
</main>
<script>
document.getElementById('retry').addEventListener('click', () => location.reload())
window.addEventListener('online', () => location.reload())
</script>
</body>
</html>

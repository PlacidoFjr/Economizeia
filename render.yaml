services:
  - type: web
    name: economizeia-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_FROM
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: CHATBOT_AI_ENABLED
        value: "false"
      - key: CHATBOT_CACHE_ENABLED
        value: "true"
      - key: BILL_UPLOAD_ENABLED
        value: "false"
      - key: MINIO_ENABLED
        value: "false"
      - key: MASK_SENSITIVE_DATA
        value: "true"

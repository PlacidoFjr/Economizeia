name: Password recovery checks

on:
  push:
    branches:
      - fix/password-reset-render
      - fix/password-reset-vercel
  pull_request:
    branches:
      - main
      - codex/deploy-free-prep

jobs:
  backend-syntax-and-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile backend
        run: python -m compileall -q backend/app
      - name: Test financial chat parser
        run: python backend/tests/test_financial_chat_parser.py
      - name: Check recovery tokens are not logged
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("backend/app/api/v1/auth.py").read_text(encoding="utf-8")
          assert "Reset token for" not in source
          assert "logger.warning(f\"Reset link" not in source
          assert "Password reset email accepted by delivery provider" in source
          assert "_check_password_reset_rate_limit(request_data.email, request)" in source
          PY

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  financial-chat-integration:
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: chat_test
          POSTGRES_PASSWORD: chat_test_local
          POSTGRES_DB: financial_chat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chat_test -d financial_chat_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://chat_test:chat_test_local@127.0.0.1:5432/financial_chat_test
      FINANCIAL_CHAT_TEST_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal backend dependencies
        run: pip install fastapi==0.104.1 sqlalchemy==2.0.23 psycopg2-binary pydantic==2.5.0 pydantic-settings==2.1.0
      - name: Test financial chat against disposable PostgreSQL
        run: python backend/tests/test_financial_chat_integration.py
